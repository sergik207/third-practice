name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        shell: bash
        run: |
          cat > .env << EOF
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          APP_PORT=${{ secrets.APP_PORT }}
          EOF
          echo "Masked .env:"
          sed 's/=.*/=***/' .env

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          docker compose down -v || true
          docker compose up -d --build
          sleep 15
          docker compose ps
          if docker compose ps | grep -q "Up"; then
            echo "All containers are running"
          else
            docker compose logs
            exit 1
          fi

      - name: Run application tests
        shell: bash
        run: |
          curl -f http://localhost:${{ secrets.APP_PORT }}/ > /dev/null
          API_RESPONSE=$(curl -sf http://localhost:${{ secrets.APP_PORT }}/api/items)
          echo "API Response: $API_RESPONSE"

          DB_COUNT=$(docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;" | tr -d ' \r\n')
          API_COUNT=$(echo "$API_RESPONSE" | grep -o '"id":' | wc -l | tr -d ' ')

          echo "DB count: $DB_COUNT | API count: $API_COUNT"
          if [ "$DB_COUNT" != "$API_COUNT" ] || [ "$DB_COUNT" -eq 0 ]; then
            echo "Data consistency test failed"
            exit 1
          fi

          curl -s http://localhost:${{ secrets.APP_PORT }}/ | grep -q "Items from DB"

      - name: Create report and logs
        if: always()
        shell: bash
        run: |
          docker compose logs > deployment-logs.txt
          docker ps -a > docker-ps.txt
          docker images > docker-images.txt
          cat > test-report.md << EOF
          # Deployment Test Report
          - Date: $(date)
          - Status: Passed
          - DB Records: $(docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;" | tr -d ' \r\n')
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-ps.txt
            docker-images.txt
          retention-days: 30
