name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        shell: pwsh
        run: |
          @"
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          APP_PORT=${{ secrets.APP_PORT }}
          "@ | Out-File -FilePath .env -Encoding utf8
          Write-Host "Masked .env:"
          (Get-Content .env) -replace '=.*', '=***'

      - name: Deploy with Docker Compose
        shell: pwsh
        run: |
          docker compose down -v
          docker compose up -d --build
          Start-Sleep -Seconds 15
          docker compose ps
          $status = docker compose ps
          if ($status -match "Up") {
            Write-Host "All containers are running"
          } else {
            docker compose logs
            exit 1
          }

      - name: Run application tests
        shell: pwsh
        run: |
          $port = "${{ secrets.APP_PORT }}"
          $html = Invoke-RestMethod -Uri "http://localhost:$port/"
          $apiResponse = Invoke-RestMethod -Uri "http://localhost:$port/api/items"
          Write-Host "API Response: $($apiResponse | ConvertTo-Json -Compress)"

          $dbCount = (docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;").Trim()
          $apiCount = $apiResponse.Count

          Write-Host "DB count: $dbCount | API count: $apiCount"
          if ([int]$dbCount -ne [int]$apiCount -or [int]$dbCount -eq 0) {
            Write-Host "Data consistency test failed"
            exit 1
          }

          if ($html -notmatch "Items from DB") {
            Write-Host "Frontend check failed"
            exit 1
          }

      - name: Create report and logs
        if: always()
        shell: pwsh
        run: |
          docker compose logs | Out-File -FilePath deployment-logs.txt -Encoding utf8
          docker ps -a | Out-File -FilePath docker-ps.txt -Encoding utf8
          docker images | Out-File -FilePath docker-images.txt -Encoding utf8
          $dbCount = (docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM items;").Trim()
          @"
          # Deployment Test Report
          - Date: $(Get-Date)
          - Status: Passed
          - DB Records: $dbCount
          "@ | Out-File -FilePath test-report.md -Encoding utf8

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            test-report.md
            deployment-logs.txt
            docker-ps.txt
            docker-images.txt
          retention-days: 30
