<!doctype html>
<html>
<head><meta charset="utf-8"><title>Items</title></head>
<body>
  <h1>Items from DB</h1>
  <ul id="list"></ul>
  <script>
    fetch('/api/items').then(r => r.json()).then(items => {
      const ul = document.getElementById('list');
      items.forEach(it => {
        const li = document.createElement('li');
        li.textContent = it.id + ': ' + it.name;
        ul.appendChild(li);
      });
    });
  </script>
</body>
</html>
